  <g id="about" class="ascii" aria-labelledby="about-title">
    <text id="about-title" x="26" y="139" font-size="15" font-weight="bold" fill="#88d6f2">-- ABOUT ME --</text>
    <text x="26" y="158"><tspan fill="#a8efd2">$</tspan> profile --about</text>
    <text x="26" y="180"><tspan class="key">role      -</tspan> <tspan fill="#ffcb92" font-weight="bold">Senior Software Engineer @ Microsoft</tspan></text>
    <text x="26" y="200"><tspan class="key">work      -</tspan> Building scalable distributed systems and AI agent systems</text>
    <text x="26" y="226"><tspan class="key">career    -</tspan> 2019–2021     Crip</text>
    <text x="26" y="246">            2021–present  Microsoft</text>
    <text x="26" y="270"><tspan class="key">exploring -</tspan> AI agents</text>

    <text x="26" y="295"><tspan class="key">bio       -</tspan> A passionate software engineer and lifelong learner.</text>
    <text x="26" y="311">            I enjoy building high-performance backend services and</text>
    <text x="26" y="327">            exploring cutting-edge technologies.</text>
    <text x="26" y="351"><tspan class="key">offline   -</tspan> Outside of coding, I love DIY projects, hiking, and sports —</text>
    <text x="26" y="367">            they keep me inspired and bring fresh perspectives to my work.</text>
    <text x="26" y="391"><tspan class="key">tools     -</tspan> Java · Python · C# · Spring · .NET · Redis · Docker</text>
  </g>

